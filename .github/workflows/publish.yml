# 发版走 npm trusted publishing（OIDC）：仓库里不存任何长期令牌，
# 每次发布由 GitHub Actions 用短凭据换一次性的发布授权。
#
# 一次性前提（在 npmjs.com 上，包的 Settings → Trusted publishing 里配）：
#   Organization or user: Grant-Felix
#   Repository:           dsh-ian-rules（仓库更名后必须在 npmjs.com 上同步改这里，否则 OIDC 交换会被拒）
#   Workflow filename:    publish.yml（只写文件名，且本文件必须已在 .github/workflows/ 下）
#   Environment name:     留空
#   Allowed actions:      勾上「direct publish with npm publish」——不勾就只能 stage，
#                         而批准 staged 版本需要在网页/CLI 上做交互式 2FA。
# 配置只认「包已存在」这个前提，所以第一个版本必须先在本地用一次性凭据发出去，
# 之后本工作流才接管。
#
# 为什么不用 NPM_TOKEN：长期令牌泄漏面大、还要轮换；OIDC 的凭据是
# 每次运行现签、用完即废，且与「哪个仓库、哪个工作流」绑定。
name: publish

on:
  # 现在只手动触发：`dsh-ian-rules` 还没在 npm 上存在，而 trusted publisher 只能配
  # 在「已存在的包」上，所以此刻任何自动触发都只会以一个必失败的红色 run 收场。
  # 等首发完成、trusted publisher 配好之后，再补上 tag 触发：
  #   push:
  #     tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # OIDC 的必需项：没有它 GitHub 不会签发身份令牌，npm 也就无法完成交换
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # trusted publishing 要求 node >= 22.14.0；官方示例用 24
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # 发布构建一律不用缓存，避免缓存投毒进产物
          package-manager-cache: false
      # 本插件零依赖（也就没有 lockfile），所以不需要 npm ci，直接跑测试
      - run: npm test
      # --tag latest 是必需的：本仓版本号是「发布日期式 + 当日序号」（如 26.9.21-1），
      # 在 semver 里属于 prerelease，不带 --tag 时 npm 会直接拒绝发布：
      #   You must specify a tag using --tag when publishing a prerelease version.
      - run: npm publish --tag latest
